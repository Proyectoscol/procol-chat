# https://github.com/ondrejbartas/sidekiq-cron
# use https://crontab.guru/ to validate
# validations for this file exist in /spec/configs/schedule_spec.rb

# executed daily at 0000 UTC
# schedules daily deferred jobs at stable times for each installation
internal_check_new_versions_job:
  cron: '0 0 * * *'
  class: 'Internal::TriggerDailyScheduledItemsJob'
  queue: scheduled_jobs
# # executed At every 5th minute..
trigger_scheduled_items_job:
  cron: '*/5 * * * *'
  class: 'TriggerScheduledItemsJob'
  queue: scheduled_jobs

# executed hourly for scheduled jobs that do not need minute-level cadence
trigger_hourly_scheduled_items_job:
  cron: '0 * * * *'
  class: 'Internal::TriggerHourlyScheduledItemsJob'
  queue: scheduled_jobs

# executed At every minute..
trigger_imap_email_inboxes_job:
  cron: '*/1 * * * *'
  class: 'Inboxes::FetchImapEmailInboxesJob'
  queue: scheduled_jobs

# executed daily at 2230 UTC
# which is our lowest traffic time
remove_stale_contact_inboxes_job.rb:
  cron: '30 22 * * *'
  class: 'Internal::RemoveStaleContactInboxesJob'
  queue: scheduled_jobs

# executed daily at 2230 UTC
# which is our lowest traffic time
remove_stale_redis_keys_job.rb:
  cron: '30 22 * * *'
  class: 'Internal::RemoveStaleRedisKeysJob'
  queue: scheduled_jobs

# DISABLED: investigating if this job is the source of orphan conversations
# #executed daily at 0430 UTC
# # which will be IST 10:00 AM
# process_stale_contacts_job:
#   cron: '30 04 * * *'
#   class: 'Internal::ProcessStaleContactsJob'
#   queue: housekeeping

# executed daily at 0100 UTC
# to delete accounts marked for deletion
delete_accounts_job:
  cron: '0 1 * * *'
  class: 'Internal::DeleteAccountsJob'
  queue: scheduled_jobs

# executed every 30 minutes for assignment_v2
periodic_assignment_job:
  cron: '*/30 * * * *'
  class: 'AutoAssignment::PeriodicAssignmentJob'
  queue: scheduled_jobs

# executed daily at 2230 UTC
# removes old notifications (>1 month) and trims to 300 per user
remove_old_notification_job:
  cron: '30 22 * * *'
  class: 'Notification::RemoveOldNotificationJob'
  queue: purgable

# executed every 12 hours
# to remove orphan conversations without contact
remove_orphan_conversations_job:
  cron: '0 */12 * * *'
  class: 'Internal::RemoveOrphanConversationsJob'
  queue: housekeeping

# executed every 5 minutes
# locks/unlocks agent availability per configured lunch-break schedules
apply_agent_availability_schedule_job:
  cron: '*/5 * * * *'
  class: 'Agents::ApplyAvailabilityScheduleJob'
  queue: scheduled_jobs

# executed every 15 minutes
# syncs clientes/facturas/pagos from the active accounting provider (Alegra)
# for every account with the "cartera" feature flag enabled
cartera_sync_job:
  cron: '*/15 * * * *'
  class: 'Cartera::SyncJob'
  queue: scheduled_jobs

# executed every 30 minutes
# evaluates the active campaign (if any) of every account with the
# "cartera" feature flag enabled against each case, within that campaign's
# own configured send window - every 30 minutes catches each campaign's
# hora_inicio without hardcoding a single time of day
cartera_campanas_corrida_job:
  cron: '*/30 * * * *'
  class: 'Cartera::Campanas::CorridaJob'
  queue: scheduled_jobs

# executed every 15 minutes
# sends the real WhatsApp message for every "programado" cartera_envios -
# split from the corrida job so retry/cadence can be tuned independently
cartera_campanas_enviar_whatsapp_job:
  cron: '*/15 * * * *'
  class: 'Cartera::Campanas::EnviarWhatsappJob'
  queue: scheduled_jobs

# executed every 15 minutes
# sends the real email for every "programado" cartera_envios - equivalent
# of cartera_campanas_enviar_whatsapp_job for Channel::Email
cartera_campanas_enviar_email_job:
  cron: '*/15 * * * *'
  class: 'Cartera::Campanas::EnviarEmailJob'
  queue: scheduled_jobs

# executed every 15 minutes
# reflects delivered/read/failed (already updated on the Message by the
# real Twilio webhook) onto cartera_envios, and blocks the whatsapp
# channel for a cliente when the Twilio error code justifies it
cartera_campanas_actualizar_estado_envios_job:
  cron: '*/15 * * * *'
  class: 'Cartera::Campanas::ActualizarEstadoEnviosJob'
  queue: scheduled_jobs

# executed on the 1st and 15th of every month at 06:00 - "every two weeks",
# approximated with calendar days since cron has no native biweekly
# interval; the job is idempotent per calendar day so this never
# double-snapshots
cartera_snapshot_job:
  cron: '0 6 1,15 * *'
  class: 'Cartera::SnapshotJob'
  queue: scheduled_jobs
